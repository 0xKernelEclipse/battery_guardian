name: Battery Guardian CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-validation:
    name: Host Test & Simulation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run Full Test & Simulation Suite
        env:
          CC: clang
        run: |
          python3 tests/run_tests.py

  arm-fap-build:
    name: ARM FAP Build (UFBT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: |
          pip install --upgrade ufbt

      - name: Update UFBT SDK
        run: |
          ufbt update

      - name: Build FAP
        run: |
          ufbt
